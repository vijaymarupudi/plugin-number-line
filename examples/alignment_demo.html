<!DOCTYPE html>
<html>
<head>
  <title>jsPsychPluginNumberLine Alignment Example</title>
  <script src="https://unpkg.com/pixi.js/dist/pixi.min.js"></script>
  <script src="https://unpkg.com/jspsych/dist/index.browser.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych/css/jspsych.css">
  <script src="../dist/index.browser.js"></script>
</head>
<body></body>
<script>
  const jsPsych = initJsPsych();

  function textTrial(label, alignment) {
    return {
      type: jsPsychPluginNumberLine,
      text_min: "0%",
      text_max: "50%",
      text_stimulus: "80%",
      line_type: "universal",
      start_tick_coords: [150, 150],
      canvas_width: 800,
      canvas_height: 350,
      line_length: 400,
      response_max_length: 600,
      preamble: `<h3>Text: ${label}</h3><p>Labels align to their tick marks.</p>`,
      label_alignment: alignment,
      require_interaction: false,
      trial_end_button: "Next",
    };
  }

  function imageTrial(label, alignment) {
    return {
      type: jsPsychPluginNumberLine,
      media_min: "img_min_demo.png",
      media_max: "img_max_demo.png",
      media_stimulus: "img_stimulus_demo.png",
      line_type: "universal",
      start_tick_coords: [150, 150],
      canvas_width: 800,
      canvas_height: 450,
      line_length: 400,
      response_max_length: 600,
      preamble: `<h3>Image: ${label}</h3><p>Images align to their tick marks.</p>`,
      label_alignment: alignment,
      require_interaction: false,
      trial_end_button: "Next",
    };
  }

  const defaultAlignmentTrial = textTrial("default (center)");
  const alignments = ["left", "center", "right"];
  const textTrials = alignments.map((alignment) => textTrial(alignment, alignment));
  const imageTrials = alignments.map((alignment) => imageTrial(alignment, alignment));

  jsPsych.run([defaultAlignmentTrial, ...textTrials, ...imageTrials]);
</script>
</html>
